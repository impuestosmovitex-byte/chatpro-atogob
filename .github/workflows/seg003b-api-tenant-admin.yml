name: SEG-003B API admin authorization (NO DEPLOY)
on:
  push:
    branches:
      - fix/seg003b-api-tenant-admin-20261113
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact complementary web proposal
        uses: actions/checkout@v4
        with:
          ref: fix/seg003b-web-admin-identity-20261113
          path: web-compatible
      - name: Verify API/web session authorization contract
        run: node .github/scripts/seg003b-contract-check.cjs
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Tenant authorization and SEG-003 regression tests
        run: npm test -- --runInBand --runTestsByPath src/tenant-admin-authorization.spec.ts src/staging-clients-readonly.spec.ts src/seg003-inbox-tenant-isolation.spec.ts src/inbox-tenant-isolation.spec.ts
      - name: NestJS API compile only
        run: npm run build
