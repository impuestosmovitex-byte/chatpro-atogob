name: MW1 staging API tests
on:
  push:
    branches:
      - feature/mw1-saas-staging-20261020
      - fix/mw1-ig-signature-diagnostics-20261109
      - fix/mw1-ig-platform-signature-20261111
      - fix/mw1-seg002-statistics-authorization-20261111
    paths:
      - 'apps/api/src/**'
      - 'apps/api/package.json'
      - 'apps/api/package-lock.json'
      - 'app/api/statistics/route.ts'
      - 'app/lib/statistics-context.ts'
      - 'docs/security/seg002-*'
      - '.github/workflows/mw1-staging-api-tests.yml'
  workflow_dispatch:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Compile staging Nest API
        run: npm run build
      - name: Run MW1 access, billing and webhook tests
        run: npm test -- --runInBand --runTestsByPath src/access-login-isolation.spec.ts src/mw1-billing-contract.spec.ts src/mw1-mp-webhook-signature.spec.ts src/staging-integrations-security.spec.ts src/staging-safety.spec.ts src/staging-instagram-oauth.spec.ts src/staging-instagram-webhook.controller.spec.ts src/staging-whatsapp-webhook.spec.ts src/staging-meta-signature.spec.ts src/staging-whatsapp-routing.spec.ts src/staging-embedded-provisioning.spec.ts src/statistics-seg002.spec.ts

  seg002-web-build:
    name: SEG-002 Next.js web compile (no deployment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Compile web with signed statistics assertion
        run: npm run build
