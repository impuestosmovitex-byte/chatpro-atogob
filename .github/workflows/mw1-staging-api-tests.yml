name: MW1 staging API tests
on:
  push:
    branches:
      - feature/mw1-saas-staging-20261020
    paths:
      - 'apps/api/src/**'
      - 'apps/api/package.json'
      - 'apps/api/package-lock.json'
      - '.github/workflows/mw1-staging-api-tests.yml'
  workflow_dispatch:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Run MW1 access, billing and webhook tests
        run: npm test -- --runInBand --runTestsByPath src/access-login-isolation.spec.ts src/mw1-billing-contract.spec.ts src/mw1-mp-webhook-signature.spec.ts src/staging-integrations-security.spec.ts src/staging-safety.spec.ts src/staging-whatsapp-webhook.spec.ts src/staging-meta-signature.spec.ts src/staging-whatsapp-routing.spec.ts
