name: MW1 staging real membership validation gate (NO DEPLOY)
on:
  push:
    branches:
      - feature/mw1-staging-session-membership-20261114
permissions:
  contents: read
jobs:
  validated-session:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: TypeScript and commercial+panel production compilation
        run: npx tsc --noEmit && npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Authenticated signed sessions owner/advisor, tenant isolation, revoked membership
        run: node scripts/test-mw1-signed-workspace-http.cjs
      - name: Real Railway staging public auth boundary
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          (async()=>{
            for(const path of ['/api/auth/session','/api/auth/capabilities']){
              const r=await fetch('https://mw1-web-staging-staging.up.railway.app'+path,{redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(15000)});
              console.log(path,r.status);
              assert.equal(r.status,401);
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE