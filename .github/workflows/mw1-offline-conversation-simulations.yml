name: MW1 multi-turn offline simulations

on:
  pull_request:
    paths:
      - 'apps/api/src/mw1-multichannel-conversation-simulations.spec.ts'
      - '.github/workflows/mw1-offline-conversation-simulations.yml'
      - 'apps/api/src/chat-agent.service.ts'
      - 'apps/api/src/meta-social-ai.service.ts'
      - 'apps/api/src/meta-social-message.service.ts'

jobs:
  offline-simulations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test -- --runInBand mw1-multichannel-conversation-simulations.spec.ts mw1-social-channel-parity.spec.ts chat-agent.atogob-postsale.spec.ts whatsapp-order-lookup-continuity.spec.ts
      - run: npm run build
