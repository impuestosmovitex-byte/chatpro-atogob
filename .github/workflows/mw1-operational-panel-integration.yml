name: MW1 operational panel integration checks (NO DEPLOY)
on:
  push:
    branches:
      - feature/mw1-staging-operational-panel-20261114
permissions:
  contents: read
jobs:
  operational-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Verify unified module links and middleware permission boundaries
        run: node scripts/test-mw1-unified-workspace-roles.cjs
      - name: Check Next.js TypeScript types
        run: npx tsc --noEmit
      - name: Compile current combined commercial and operational Web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Verify actual Railway public auth boundary after compilation
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const base='https://mw1-web-staging-staging.up.railway.app';
          const routes=[['/login',200],['/panel',307],['/api/auth/session',401],['/api/auth/capabilities',401],['/api/inbox',401],['/api/clients',401]];
          (async()=>{
            for(const [path,status] of routes) {
              const response=await fetch(base+path,{redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(15000)});
              console.log(path,response.status);
              assert.equal(response.status,status,'Staging boundary changed for '+path);
            }
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
