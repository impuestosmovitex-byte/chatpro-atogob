name: MW1 existing AI settings read-only staging integration (NO DEPLOY)
on:
  push:
    branches:
      - feature/mw1-staging-readonly-settings-20261114
permissions:
  contents: read
jobs:
  settings-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Verify existing settings reader and staging write denial
        run: npx jest --runInBand staging-settings-readonly.spec.ts
      - name: Build actual isolated API module
        run: npx nest build
