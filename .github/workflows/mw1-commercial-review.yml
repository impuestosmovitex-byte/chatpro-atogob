name: MW1 commercial review (NO DEPLOY)
on:
  push:
    branches:
      - feature/mw1-commercial-leads-20261114
  pull_request:
    branches:
      - feature/mw1-unified-workspace-20261114
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build web without publishing
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  api-demo-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Commercial demo intake unit tests
        run: npx jest --runInBand staging-demo-requests.controller.spec.ts platform-demo-followup.spec.ts
      - name: NestJS application compilation (excludes unrelated legacy specs)
        run: npx nest build
  static-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preview server syntax
        run: node --check preview/comercial/server.mjs
      - name: Verify static mockup has no backend or outbound connections
        run: |
          test -f preview/comercial/index.html
          ! grep -E 'fetch\(|XMLHttpRequest|WebSocket|supabase|CHATPRO_INBOX_KEY|localhost:|api/marketing/demo-request' preview/comercial/index.html
      - name: Verify isolated preview HTTP
        run: |
          PORT=9876 node preview/comercial/server.mjs &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:9876/healthz && break || sleep 1; done
          curl -fsS http://127.0.0.1:9876/ -o /tmp/mw1-preview.html
          grep -q 'MAQUETA DE REVISIÓN' /tmp/mw1-preview.html
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:9876/)" = '405'
