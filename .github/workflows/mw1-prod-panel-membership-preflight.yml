name: MW1 production panel membership preflight (NO DEPLOY)
on:
  push:
    branches:
      - feature/mw1-prod-panel-membership-gate-20261114
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Verify opt-in isolated by tenant and current membership
        run: node scripts/test-mw1-panel-optin.cjs
      - name: TypeScript and original CRM build (no production deploy)
        run: npx tsc --noEmit && npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'