name: MW1 commercial API compatibility gate (NO DEPLOY)
on:
  push:
    branches:
      - feature/mw1-commercial-api-compatible-20261114
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Commercial intake tests
        run: npx jest --runInBand staging-demo-requests.controller.spec.ts
      - name: Platform authorization and assertion regression
        run: npx jest --runInBand internal-attestation.spec.ts platform-demo-signed-pagination.spec.ts
      - name: Build current staging API with minimal commercial delta
        run: npm run build
