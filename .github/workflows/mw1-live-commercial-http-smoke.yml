name: MW1 deployed commercial HTTP smoke (NO DEPLOY)
on:
  push:
    branches:
      - feature/mw1-commercial-unified-web-deploy-20261114
permissions:
  contents: read
jobs:
  public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual existing Railway staging pages and synthetic submission
        run: node scripts/test-mw1-live-commercial-http.cjs
