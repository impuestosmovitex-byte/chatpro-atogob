name: SEG-003C API signed identity (NO DEPLOY)
on:
  push:
    branches:
      - fix/seg003c-api-attestation-20261113
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: SEG-003C asymmetric service assertion and SEG-003B regression tests
        run: npm test -- --runInBand --runTestsByPath src/internal-attestation.spec.ts src/tenant-admin-authorization.spec.ts src/staging-clients-readonly.spec.ts src/seg003-inbox-tenant-isolation.spec.ts
      - name: Compile NestJS (no deployment)
        run: npm run build
