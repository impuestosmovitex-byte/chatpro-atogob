name: SEG-003C API signed identity (NO DEPLOY)
on:
  push:
    branches:
      - fix/seg003c-api-attestation-20261113
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact complementary SEG-003C web proposal
        uses: actions/checkout@v4
        with:
          ref: fix/seg003c-web-attestation-20261113
          path: web-compatible
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Test actual web signer against API verifier (synthetic keys)
        run: node ../../.github/scripts/seg003c-cross-branch-contract.cjs
      - name: Verify bootstrap, assisted recovery and public pricing access boundaries
        run: node ../../.github/scripts/seg003c-special-flows.cjs
      - name: Audit all platform admin routes and explicit prelogin exceptions
        run: node ../../.github/scripts/seg003c-platform-coverage.cjs
      - name: SEG-003C asymmetric service assertion and SEG-003B regression tests
        run: npm test -- --runInBand --runTestsByPath src/internal-attestation.spec.ts src/tenant-admin-authorization.spec.ts src/staging-clients-readonly.spec.ts src/seg003-inbox-tenant-isolation.spec.ts src/platform-recovery-request.spec.ts src/staging-admin-invitation-recovery.spec.ts src/staging-my-plan-seg003c.spec.ts
      - name: Compile NestJS (no deployment)
        run: npm run build
