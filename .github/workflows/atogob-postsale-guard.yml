name: ATOGOB post-sale safety guard

on:
  push:
    branches:
      - fix/atogob-postsale-human-handoff-20261107
  pull_request:
    paths:
      - 'apps/api/src/chat-agent.service.ts'
      - 'apps/api/src/chat-agent.atogob-postsale.spec.ts'
      - '.github/workflows/atogob-postsale-guard.yml'

jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand chat-agent.atogob-postsale.spec.ts
      - run: npm run build
