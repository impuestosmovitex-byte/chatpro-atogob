name: SEG-003 staging clients read-only (NO DEPLOY)
on:
  push:
    branches:
      - fix/seg003-staging-clients-readonly-20261112
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Synthetic isolated tenant/permission tests
        run: npm test -- --runInBand --runTestsByPath src/staging-clients-readonly.spec.ts src/seg003-inbox-tenant-isolation.spec.ts src/inbox-tenant-isolation.spec.ts
      - name: Staging API regression compile (no deployment)
        run: npm run build
