name: MW1 staging read-only roles integration (NO DEPLOY)
on:
  push:
    branches:
      - feature/mw1-staging-readonly-roles-20261114
permissions:
  contents: read
jobs:
  read-only-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Check existing roles controller is read-only in staging
        run: npx jest --runInBand staging-roles-readonly.spec.ts
      - name: Verify existing API builds with staging module
        run: npx nest build
