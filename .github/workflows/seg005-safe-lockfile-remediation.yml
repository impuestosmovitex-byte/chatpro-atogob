name: SEG-005 controlled npm lockfile remediation
on:
  push:
    branches:
      - security/seg005-npm-dependency-remediation-20261116
    paths:
      - .github/workflows/seg005-safe-lockfile-remediation.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remediate-and-check:
    if: github.ref_name == 'security/seg005-npm-dependency-remediation-20261116'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/seg005-npm-dependency-remediation-20261116
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply nonbreaking npm audit fixes to lockfile only
        working-directory: apps/api
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --ignore-scripts --no-fund > /tmp/seg005-audit-fix.txt 2>&1
          status=$?
          set -e
          echo "npm audit fix exit: $status (can be nonzero for unfixable advisories)"
          tail -n 55 /tmp/seg005-audit-fix.txt
          test -s package-lock.json
      - name: Install exactly the revised lockfile
        working-directory: apps/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run social-media authorization and laboratory regression tests
        working-directory: apps/api
        run: npm test -- --runInBand social-media-url-policy.spec.ts inbox-social-media.integration.spec.ts media-lab.integration.spec.ts
      - name: Compile the Nest API
        working-directory: apps/api
        run: npm run build
      - name: Report remaining runtime advisories without applying more fixes
        working-directory: apps/api
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/seg005-runtime-audit.json || true
          node -e 'const f=require("/tmp/seg005-runtime-audit.json"); if(!f.metadata)process.exit(2); console.log("RUNTIME AUDIT COUNTS",JSON.stringify(f.metadata.vulnerabilities)); console.log("CRITICAL/HIGH PACKAGES",JSON.stringify(Object.entries(f.vulnerabilities||{}).filter(([k,v])=>["critical","high"].includes(v.severity)).map(([k,v])=>({name:k,severity:v.severity,fixAvailable:v.fixAvailable}))))'
      - name: Commit only the validated lockfile change to this isolated branch
        shell: bash
        run: |
          set -e
          git add apps/api/package-lock.json
          if git diff --cached --quiet; then
            echo "No safe lockfile changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): nonbreaking audited lockfile updates [skip ci]"
          git push origin HEAD:security/seg005-npm-dependency-remediation-20261116
