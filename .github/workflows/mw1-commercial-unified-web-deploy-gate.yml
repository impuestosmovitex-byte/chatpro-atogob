name: MW1 commercial unified web deploy gate (NO DEPLOY)
on:
  push:
    branches:
      - feature/mw1-commercial-unified-web-deploy-20261114
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build without deploy
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Unified workspace role and security regression
        run: node scripts/test-mw1-unified-workspace-roles.cjs
      - name: Signed workspace guard regression
        run: node scripts/test-mw1-signed-workspace-http.cjs
