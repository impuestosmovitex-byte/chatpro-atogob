name: AI WhatsApp delivery receipts
on:
  push:
    branches:
      - fix/whatsapp-ai-delivery-receipts-20261107
  pull_request:
    paths:
      - 'apps/api/src/whatsapp-webhook.controller.ts'
      - 'apps/api/src/whatsapp-ai-delivery.spec.ts'
      - '.github/workflows/ai-whatsapp-delivery.yml'
jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      # Unit tests and TypeScript compilation do not require the ffmpeg binary download.
      - run: npm ci --ignore-scripts
      - run: npm test -- --runInBand whatsapp-ai-delivery.spec.ts
      - run: npm run build
