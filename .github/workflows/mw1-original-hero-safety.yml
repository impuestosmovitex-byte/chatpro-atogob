name: MW1 original full-resolution hero validation (NO DEPLOY)
on:
  push:
    branches:
      - feature/mw1-hero-quality-correction-20261114
permissions:
  contents: read
jobs:
  hero-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Exact original user image, do not optimize or resize
        run: |
          test -s public/media/mw1-hero-original.png
          test "$(git hash-object public/media/mw1-hero-original.png)" = "4f9a5894eacddcb3d3a6ee6876273cae13cb389f"
          test "$(stat -c%s public/media/mw1-hero-original.png)" = "2440095"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: node scripts/test-mw1-unified-workspace-roles.cjs
      - run: node scripts/test-mw1-signed-workspace-http.cjs
