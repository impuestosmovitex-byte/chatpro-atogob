name: MW1 exact hero photo live staging check (NO DEPLOY)
on:
  push:
    branches:
      - feature/mw1-exact-photo-on-operational-20261114
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual live MW1 home displays uploaded picture
        run: |
          node - <<'NODE'
          (async()=>{
            const base='https://mw1-web-staging-staging.up.railway.app';
            const page=await fetch(base+'/inicio',{redirect:'manual'});
            if(page.status!==200)throw Error('Home page HTTP '+page.status);
            const html=await page.text();
            for(const marker of ['/media/mw1-hero-uploaded.avif','Solicitar demostración','/precios','ChatPro MW1']){
              if(!html.includes(marker))throw Error('Home missing '+marker);
            }
            const img=await fetch(base+'/media/mw1-hero-uploaded.avif');
            if(img.status!==200)throw Error('Uploaded image HTTP '+img.status);
            const data=await img.arrayBuffer();
            const bytes=new Uint8Array(data);
            console.log('Asset HTTP type',img.headers.get('content-type'),'bytes',bytes.byteLength,'first-hex',Array.from(bytes.slice(0,32)).map(b=>b.toString(16).padStart(2,'0')).join(''));
            const digest=await crypto.subtle.digest('SHA-256',bytes);
            const hex=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
            console.log('Verified uploaded AVIF bytes:',bytes.byteLength,hex);if(!((img.headers.get('content-type')||'').includes('image/avif')))throw Error('Image route did not return AVIF bytes');
            const admin=await fetch(base+'/admin/prospectos',{redirect:'manual'});
            if(![301,302,303,307,308,401,403].includes(admin.status))throw Error('Admin route not guarded: '+admin.status);
            console.log('PASS live image, home CTA, plans, and admin protection');
          })().catch(e=>{console.error(e);process.exitCode=1})
          NODE
