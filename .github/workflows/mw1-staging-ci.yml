name: MW1 staging - compile and safety tests

on:
  push:
    branches:
      - feature/mw1-saas-staging-20261020
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mw1-staging-checks
  cancel-in-progress: true

jobs:
  api:
    name: Nest API compile and staging safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build API
        run: npm run build
      - name: Execute isolation tests
        run: npm test -- --runInBand staging-safety.spec.ts staging-sales-brain.spec.ts staging-vision.spec.ts staging-product-facts.spec.ts staging-catalog-admin-command.spec.ts platform-company-readiness.spec.ts staging-demo-requests.controller.spec.ts platform-plan-drafts.spec.ts platform-admin-security.spec.ts platform-external-tenants.spec.ts access-platform.spec.ts platform-admin-invitation.spec.ts platform-ai-usage-metering.spec.ts platform-ai-cost.spec.ts chat-agent-individual-product.spec.ts

  web:
    name: Next.js compile and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify native CSV Excel and PDF catalog importer (offline)
        run: node scripts/test-native-catalog-import.cjs
      - name: Validate catalog source status (offline)
        run: node scripts/test-staging-catalog-sources.cjs
      - name: Verify visual follow-up selection (offline)
        run: node scripts/test-visual-refinement.cjs
      - name: Build web
        run: npm run build
