name: MW1 production panel opt-in preparation (NO DEPLOY)
on:
  push:
    branches:
      - feature/mw1-production-panel-optin-prep-20261114
permissions:
  contents: read
jobs:
  check-optin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Test fail-closed ATOGOB and MAOGO opt-in isolation
        run: node scripts/test-mw1-panel-optin.cjs
      - name: Validate TypeScript on actual production Web base
        run: npx tsc --noEmit
      - name: Compile original CRM Web with opt-in panel disabled
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
