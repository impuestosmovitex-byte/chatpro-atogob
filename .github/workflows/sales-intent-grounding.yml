name: Tenant-neutral sales intent and handoff checks
on:
  push:
    branches: [fix/mw1-tenant-neutral-sales-intent-20261108]
  pull_request:
    paths:
      - 'apps/api/src/chat-agent.service.ts'
      - 'apps/api/src/sales-intent-grounding.util.ts'
      - 'apps/api/src/sales-intent-grounding.util.spec.ts'
      - '.github/workflows/sales-intent-grounding.yml'
jobs:
  api-safety-regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand --testPathIgnorePatterns=customer-order.service.spec.ts
      - run: npm run build
